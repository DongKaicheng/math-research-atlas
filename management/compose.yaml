name: openmath-management

services:
  management:
    build:
      context: ..
      dockerfile: management/Dockerfile
    image: openmath-management:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      OPENMATH_DB: /var/lib/openmath/openmath.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - management_data:/var/lib/openmath
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "management/scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3

  # Optional. Omit --profile tls when TLS is provided by an existing proxy.
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      management:
        condition: service_healthy
    environment:
      MANAGEMENT_DOMAIN: ${MANAGEMENT_DOMAIN:?Set MANAGEMENT_DOMAIN in management/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  management_data:
  caddy_data:
  caddy_config:
