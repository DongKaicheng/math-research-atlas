name: General feedback
description: "Comment on the website, exposition, navigation, accessibility, or collaboration."
title: "[General] "
body:
  - type: markdown
    attributes:
      value: |
        General comments are welcome. You do not need a theorem, project, or version number.
        This is a **public** GitHub Issue. Your GitHub username, text, and attachments are public.
        If useful, attach a .zip file in the message box. Never upload confidential material.
  - type: input
    id: page
    attributes:
      label: Related page (optional)
      description: "A link may help us understand your comment; leaving this blank is fine."
  - type: textarea
    id: details
    attributes:
      label: Your feedback
      description: "Tell us what is helpful, unclear, missing, or could be improved. General opinions are welcome."
    validations:
      required: true
  - type: dropdown
    id: credit_preference
    attributes:
      label: Public acknowledgement preference (optional)
      description: "This controls extra credit on project acknowledgement pages, not authorship. Your GitHub username and Issue remain public even if you choose not to be named there."
      default: 0
      options:
        - "Ask me before naming me"
        - "Credit my GitHub username if this feedback is adopted"
        - "Credit the name specified below if this feedback is adopted"
        - "Do not name me on acknowledgement pages"
    validations:
      required: false
  - type: input
    id: credit_name
    attributes:
      label: Public credit name (optional)
      description: "Complete this only if you selected the named-credit option. Use a name or pseudonym you want displayed publicly; do not include an email address or private contact details."
      placeholder: "Name or pseudonym for public acknowledgement"
    validations:
      required: false
  - type: checkboxes
    id: public
    attributes:
      label: Public contribution
      options:
        - label: "I understand that this Issue and its attachments will be public."
          required: true
