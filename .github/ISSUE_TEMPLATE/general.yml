name: General feedback
description: "Comment on the website, exposition, navigation, accessibility, or collaboration."
title: "[General] "
body:
  - type: markdown
    attributes:
      value: |
        General comments are welcome. You do not need a theorem, project, or version number.
        This is a **public** GitHub Issue. Your GitHub username, text, and attachments are public.
        If useful, attach a .zip file in the message box. Never upload confidential material.
  - type: input
    id: page
    attributes:
      label: Related page (optional)
      description: "A link may help us understand your comment; leaving this blank is fine."
  - type: textarea
    id: details
    attributes:
      label: Your feedback
      description: "Tell us what is helpful, unclear, missing, or could be improved. General opinions are welcome."
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public contribution
      options:
        - label: "I understand that this Issue and its attachments will be public."
          required: true
