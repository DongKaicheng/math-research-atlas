name: Apply to be a project manager
description: "Help maintain a mathematical project, review contributions and improve its pages."
title: "[Maintainer-application] "
body:
  - type: markdown
    attributes:
      value: |
        We welcome applications from people who would like to help maintain OpenMath.
        Choose a project and a manageable scope. You can contribute mathematical review, exposition, references, logical maps or ongoing feedback care.
        The site owner reviews applications and grants project-specific access separately.
        This is a **public** GitHub Issue. Your GitHub username, text, links and attachments will be public. A public profile or .zip writing sample is optional; do not include private contact details or confidential materials.
  - type: input
    id: preferred-project
    attributes:
      label: Preferred project or subject
      description: "Name an existing project or describe the area in which you would like to help."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant experience and interests
      description: "Tell us about your mathematical background or related work. Formal credentials are optional."
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Areas of contribution
      options:
        - label: "Mathematical review and checking references"
        - label: "Writing, editing and notation"
        - label: "Logical maps and source organisation"
        - label: "Responding to feedback and coordinating revisions"
        - label: "Website maintenance or formalisation"
  - type: textarea
    id: scope
    attributes:
      label: Proposed maintenance scope
      description: "Suggest the pages or tasks you would take responsibility for and the time you can reasonably give. A small, focused commitment is welcome."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Public examples (optional)
      description: "Links to notes, papers, a repository or previous contributions may help."
  - type: checkboxes
    id: public
    attributes:
      label: Public application
      options:
        - label: "I understand that this application is public and that access is granted separately by the site owner."
          required: true
