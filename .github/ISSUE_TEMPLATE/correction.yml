name: Correction
description: "Report an error or missing assumption, and explain the proposed correction."
title: "[Correction] "
body:
  - type: markdown
    attributes:
      value: |
        This is a **public** GitHub Issue. Your GitHub username, text, and ZIP attachments will be visible to everyone.
        Drag and drop a .zip file containing LaTeX or Lean sources into the detail field if useful.
  - type: input
    id: project
    attributes:
      label: Project (optional)
      description: "Use the project slug if this concerns one project; leave blank for a general mathematical question."
      placeholder: "strong-green, bedford-taylor, or foundations"
  - type: input
    id: target
    attributes:
      label: Related project or result
      description: "Give the exact result ID, page, or paper section if relevant. Leave blank if the comment is not about a particular result."
      placeholder: "For example: strong-green or /r/EXACT-ID/"
  - type: input
    id: version
    attributes:
      label: Version (if relevant)
      description: "The exact edition or revision being discussed, if known. Please do not guess a version."
      placeholder: "For example: v0.5.1 or project version 1"
  - type: textarea
    id: details
    attributes:
      label: "What needs to be corrected?"
      description: "Be specific. You can attach .zip sources here using GitHub's upload control."
      placeholder: "Explain your contribution, with hypotheses, links, and mathematics where relevant."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Sources and references
      description: "Papers, sections, source files, or existing discussions, if useful."
  - type: dropdown
    id: credit_preference
    attributes:
      label: Public acknowledgement preference (optional)
      description: "This controls extra credit on project acknowledgement pages, not authorship. Your GitHub username and Issue remain public even if you choose not to be named there."
      default: 0
      options:
        - "Ask me before naming me"
        - "Credit my GitHub username if this feedback is adopted"
        - "Credit the name specified below if this feedback is adopted"
        - "Do not name me on acknowledgement pages"
    validations:
      required: false
  - type: input
    id: credit_name
    attributes:
      label: Public credit name (optional)
      description: "Complete this only if you selected the named-credit option. Use a name or pseudonym you want displayed publicly; do not include an email address or private contact details."
      placeholder: "Name or pseudonym for public acknowledgement"
    validations:
      required: false
  - type: checkboxes
    id: public
    attributes:
      label: Public contribution
      options:
        - label: "I understand that this Issue and its attachments will be public."
          required: true
