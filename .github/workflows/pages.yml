name: Publish mathematical atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      history_base_sha:
        description: Full 40-character SHA of the reviewed pre-change history baseline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Select approved deployment configuration
        id: deployment_config
        env:
          DEPLOY_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/' }}
          DEPLOY_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://openmath-atlas.org' }}
          DEPLOY_BRAND: ${{ vars.SITE_BRAND || 'OpenMath' }}
        run: |
          case "${DEPLOY_BASE_PATH}|${DEPLOY_ORIGIN}|${DEPLOY_BRAND}" in
            '/math-research-atlas|https://dongkaicheng.github.io/math-research-atlas|Conjecture Atlas')
              printf 'artifact_path=dist-legacy\n' >> "$GITHUB_OUTPUT"
              ;;
            '/|https://openmath-atlas.org|OpenMath')
              printf 'artifact_path=dist\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo '::error::Unapproved deployment configuration. Leave all SITE_* variables unset for the default OpenMath site, or set all three to one complete approved combination (OpenMath or legacy rollback).'
              exit 1
              ;;
          esac
      - name: Read existing Pages binding
        id: pages_binding
        if: steps.deployment_config.outputs.artifact_path == 'dist' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/configure-pages@v5
        with:
          # Read the existing site only. Never enable or reconfigure Pages.
          enablement: 'false'
      - name: Require the OpenMath domain before cutover
        if: steps.pages_binding.outcome == 'success'
        env:
          PAGES_HOST: ${{ steps.pages_binding.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages_binding.outputs.base_path }}
        run: |
          printf 'Configured Pages host: %s; base path: %s\n' "$PAGES_HOST" "$PAGES_BASE_PATH"
          if [ "$PAGES_HOST" != 'openmath-atlas.org' ]; then
            echo '::error::Set this repository Pages Custom domain to openmath-atlas.org before publishing the OpenMath artifact.'
            exit 1
          fi
          case "$PAGES_BASE_PATH" in
            ''|'/') ;;
            *)
              echo '::error::OpenMath must be published at the domain root.'
              exit 1
              ;;
          esac
      - name: Build legacy publication baseline
        run: npm run build
        env:
          SITE_BASE_PATH: /math-research-atlas
          SITE_ORIGIN: https://dongkaicheng.github.io/math-research-atlas
          SITE_BRAND: Conjecture Atlas
          GITHUB_REPOSITORY: DongKaicheng/math-research-atlas
      - name: Check legacy content and links
        run: npm run check
      - name: Check legacy frozen release integrity
        run: npm run check:release
      - name: Retain checked legacy artifact
        run: |
          test ! -e dist-legacy
          mv dist dist-legacy
      - name: Build OpenMath custom-domain publication
        run: npm run build
        env:
          SITE_BASE_PATH: /
          SITE_ORIGIN: https://openmath-atlas.org
          SITE_BRAND: OpenMath
          GITHUB_REPOSITORY: DongKaicheng/math-research-atlas
      - name: Check custom-domain routes and links
        run: npm run check:domain
        env:
          SITE_BASE_PATH: /
          SITE_ORIGIN: https://openmath-atlas.org
          SITE_BRAND: OpenMath
      - name: Check custom-domain frozen release integrity
        run: npm run check:release
      - name: Preserve published history
        run: npm run check:history
        env:
          HISTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.history_base_sha }}
      - name: Upload checked pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload exactly one checked artifact, after verifying the live
          # Pages host for an OpenMath root deployment.
          path: ${{ steps.deployment_config.outputs.artifact_path }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
