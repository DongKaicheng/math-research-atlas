name: Publish mathematical atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static pages
        run: npm run build
        env:
          SITE_BASE_PATH: /math-research-atlas
          SITE_ORIGIN: https://dongkaicheng.github.io/math-research-atlas
          GITHUB_REPOSITORY: DongKaicheng/math-research-atlas
      - name: Check generated content and links
        run: npm run check
      - name: Check frozen release integrity
        run: npm run check:release
      - name: Preserve published history
        run: npm run check:history
        env:
          HISTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload checked pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
