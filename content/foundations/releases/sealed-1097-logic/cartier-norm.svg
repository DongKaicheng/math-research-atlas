<g id="lm-v12-cartier-norm-a_node-NAG-002541"><a xlink:href="index.html#node-NAG-002541" xlink:title="\begin{corollary}[Pulled-back Cartier sections]\label{f9ds:cartier}&#10;Let $s$ be a section of a line bundle $\cM$ which is a non-zero-divisor&#10;in every local trivialization. Then $q^*s$ is again a Cartier section.&#10;The determinant of multiplication by $q^*s$ gives a section of&#10;$n-NAG-002541m_q(q^*\cM)$ which, under \eqref{eq:ex68:f9ds:norm-projection}, is $s^{\otimes n}$.&#10;Its effective Cartier divisor is $n\,\operatorname{div}(s)$.&#10;\end{corollary}" target="_top">
