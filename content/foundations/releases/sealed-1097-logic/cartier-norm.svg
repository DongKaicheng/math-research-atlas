<g id="lm-v12-cartier-norm-node-NAG-002539" class="node" data-logic-node="NAG-002539">
<title>n-NAG-002539</title>
<g id="lm-v12-cartier-norm-a_node-NAG-002539"><a xlink:href="index.html#node-NAG-002539" xlink:title="\begin{proposition}[Norm projection]\label{f9ds:normprojection}&#10;For line bundles $\cL$ on $Y$ and $\cM$ on $X$, there is a canonical&#10;isomorphism&#10;\begin{equation}\label{eq:ex68:f9ds:norm-projection}&#10; n-NAG-002539m_q(\cL\otimes q^*\cM)&#10;       \simeq n-NAG-002539m_q(\cL)\otimes\cM^{\otimes n}.&#10;\end{equation}&#10;In particular $n-NAG-002539m_q(q^*\cM)\simeq\cM^{\otimes n}$.&#10;The formulas commute with analytic base change.&#10;Consequently the kernel of $\Pic(X)\to\Pic(Y)$ is killed by $n$.&#10;\end{proposition}" target="_top">
