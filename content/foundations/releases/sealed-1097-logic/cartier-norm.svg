<g id="lm-v12-cartier-norm-node-CLAUSE:NAG-002525:coherent_tensor_projection" class="node" data-logic-node="CLAUSE:NAG-002525:coherent_tensor_projection">
<title>n-CLAUSE:NAG-002525:coherent_tensor_projection</title>
<g id="lm-v12-cartier-norm-a_node-CLAUSE:NAG-002525:coherent_tensor_projection"><a xlink:href="index.html#node-CLAUSE:NAG-002525:coherent_tensor_projection" xlink:title="\begin{proof}&#10;On $V=\cM(A)$ and its full inverse image $\cM(B)$, let $M$ and $N$&#10;represent $\cE$ and $\cF$. The map&#10;\[&#10; N\otimes_B(B\otimes_A M)\longrightarrow N\otimes_A M,\qquad&#10; n\otimes(b\otimes m)\longmapsto bn\otimes m&#10;\]&#10;has inverse $n\otimes m\mapsto n\otimes(1\otimes m)$.&#10;These are maps of finite $A$-modules, so they are bounded, with bounded&#10;inverses, for the canonical norms. The finite-tensor theorem identifies&#10;the modules with the analytic completed constructions.&#10;&#10;For a bounded affinoid base change $A\to C$, put $D=B\otimes_A C$.&#10;The same formulas identify both base changes with&#10;$N\otimes_A M\otimes_A C$. In particular they respect domain restrictions.&#10;The finite coherent direct-image theorem and affinoid coherent equivalence&#10;therefore glue them to \eqref{eq:tensorprojection}. This argument concerns&#10;an isomorphism of tensors, and asserts no exactness for tensoring with&#10;an arbitrary $\cE$.&#10;\end{proof}" target="_top">
<path fill="#edf4ee" stroke="#587b65" stroke-width="1.1" d="M233,-502C233,-502 12,-502 12,-502 6,-502 0,-496 0,-490 0,-490 0,-438 0,-438 0,-432 6,-426 12,-426 12,-426 233,-426 233,-426 239,-426 245,-432 245,-438 245,-438 245,-490 245,-490 245,-496 239,-502 233,-502" />
<text text-anchor="start" x="13.5" y="-483" font-family="Arial" font-size="10.00" fill="#587b65">ESTABLISHED IN SOURCE</text>
<text text-anchor="start" x="13.5" y="-458.4" font-family="Arial" font-weight="bold" font-size="17.00">Selected clause · coherent</text>
<text text-anchor="start" x="52" y="-441.4" font-family="Arial" font-weight="bold" font-size="17.00">tensor projection</text>
</a>
</g>
</g>

<g id="lm-v12-cartier-norm-node-NAG-001624" class="node" data-logic-node="NAG-001624">
<title>n-NAG-001624</title>
<g id="lm-v12-cartier-norm-a_node-NAG-001624"><a xlink:href="index.html#node-NAG-001624" xlink:title="\begin{theorem}[\bi{Kiehl and Theorem B on the analytic G-site}{解析 G-site 上的 Kiehl 与 Theorem B}]&#10;\label{fnd:fullgkiehltheoremb}&#10;\bi{The functors}&#10;{函子}&#10;\[&#10; \operatorname{Mod}^{\mathrm{fin}}(A)&#10; \ \rightleftarrows\ \operatorname{Coh}(X_G),&#10; \qquad M\longmapsto\widetilde M,&#10; \qquad\mathcal F\longmapstoLogicMapamma(X,\mathcal F)&#10;\]&#10;\bi{are inverse exact equivalences, where $\widetilde M(V)=A_V\otimes_A M$ on affinoid domains. Every coherent sheaf has a global finite free presentation. For every affinoid domain $V$ and every $q&gt;0$,}&#10;{互逆且正合，其中在 affinoid 域上有 $\widetilde M(V)=A_V\otimes_A M$。每个凝聚层都有整体有限自由表示。对每个 affinoid 域 $V$ 及每个 $q&gt;0$，均有}&#10;\[&#10; H^q(V_G,\mathcal F|_{V_G})=0.&#10;\]&#10;\bi{The cohomology is derived sheaf cohomology on the full analytic G-site.}&#10;{这里的上同调是在完整解析 G-site 上的导出层上同调。}&#10;\end{theorem}" target="_top">
<path fill="#edf4ee" stroke="#587b65" stroke-width="1.1" d="M1055,-502C1055,-502 826,-502 826,-502 820,-502 814,-496 814,-490 814,-490 814,-438 814,-438 814,-432 820,-426 826,-426 826,-426 1055,-426 1055,-426 1061,-426 1067,-432 1067,-438 1067,-438 1067,-490 1067,-490 1067,-496 1061,-502 1055,-502" />
<text text-anchor="start" x="827.5" y="-483" font-family="Arial" font-size="10.00" fill="#587b65">ESTABLISHED IN SOURCE</text>
<text text-anchor="start" x="827.5" y="-458.4" font-family="Arial" font-weight="bold" font-size="17.00">Kiehl and Theorem B on the</text>
<text text-anchor="start" x="881.5" y="-441.4" font-family="Arial" font-weight="bold" font-size="17.00">analytic G-site</text>
</a>
</g>
</g>

<g id="lm-v12-cartier-norm-node-NAG-001752" class="node" data-logic-node="NAG-001752">
<title>n-NAG-001752</title>
<g id="lm-v12-cartier-norm-a_node-NAG-001752"><a xlink:href="index.html#node-NAG-001752" xlink:title="\begin{proposition}[\bi{Coherent direct image under a finite morphism}{有限态射的凝聚直接像}]&#10;\label{fnd:finitecoherentdirectimagebasechange}&#10;\bi{Let $\pi:Y\to T$ be a norm-admissible finite analytic morphism and let $\mathcal F$ be coherent on $Y_G$. Then $\pi_*\mathcal F$ is coherent on $T_G$, and formation of this direct image is exact and commutes with every analytic base change, including base change over an arbitrary complete extension of the ground field.}&#10;{设 $\pi:Y\to T$ 为 norm-admissible 的有限解析态射，且 $\mathcal F$ 在 $Y_G$ 上凝聚。则 $\pi_*\mathcal F$ 在 $T_G$ 上凝聚，直接像函子正合，并与每个解析基变换交换，包括任意完备基域扩张上的基变换。}&#10;\end{proposition}" target="_top">
<path fill="#edf4ee" stroke="#587b65" stroke-width="1.1" d="M533,-502C533,-502 282,-502 282,-502 276,-502 270,-496 270,-490 270,-490 270,-438 270,-438 270,-432 276,-426 282,-426 282,-426 533,-426 533,-426 539,-426 545,-432 545,-438 545,-438 545,-490 545,-490 545,-496 539,-502 533,-502" />
<text text-anchor="start" x="283.5" y="-483" font-family="Arial" font-size="10.00" fill="#587b65">ESTABLISHED IN SOURCE</text>
<text text-anchor="start" x="283.5" y="-458.4" font-family="Arial" font-weight="bold" font-size="17.00">Coherent direct image under a</text>
<text text-anchor="start" x="343.5" y="-441.4" font-family="Arial" font-weight="bold" font-size="17.00">finite morphism</text>
</a>
</g>
</g>

