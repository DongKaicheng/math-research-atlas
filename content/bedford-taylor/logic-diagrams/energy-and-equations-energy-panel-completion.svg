<g id="energy-and-equations-energy-panel-completion--energy&#45;and&#45;equations&#45;energy&#45;panel&#45;completion&#45;r&#45;energy&#45;r1&#45;mixed&#45;energy" class="node">
<title>r&#45;energy&#45;r1&#45;mixed&#45;energy</title>
<g id="energy-and-equations-energy-panel-completion--a_energy&#45;and&#45;equations&#45;energy&#45;panel&#45;completion&#45;r&#45;energy&#45;r1&#45;mixed&#45;energy"><a xlink:href="#logic-energy-and-equations-energy-r1-mixed-energy" xlink:title="Fix the original field and tests, the strict Laurent domain, and one allowed S extending to a neighborhood of its closure; q=n−p≥1. Every input u_i is an actual negative classical first&#45;energy potential with compact negative sublevels, canonical no loss and finite first energy. Use the Laurent barrier approximants max(u_i,jρ), their finite mixed masses, and the critical weighted convergence supplied by the truncation theorem. The proof applies bounded Green exchange after fixing the other curvature slots, then passes the barrier approximants to obtain full mixed symmetry. The positive energy matrix gives Cauchy–Schwarz and Hölder constant one. Repeated slot exchange gives the tester estimate; the segment second&#45;variation formula gives the midpoint bound. These are joint proof inputs, not a claim that a tail bound alone yields global symmetry.">
